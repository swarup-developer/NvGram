name: Issue tracking
on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: issue-tracking-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trusted automation only (never PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate, associate and audit without closing
        run: node Tools/Automation/issues.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue-audit-${{ github.run_id }}
          path: artifacts/issues
          retention-days: 90
